<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сөздерді басып шығару арқылы қазақ тілін үйреніңіз</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="welcome">
      <div class="welcome-container">
        <img src="logo.png" alt="Логотип" class="logo">
        <h1>Сөздерді басып шығару арқылы қазақ тілін үйреніңіз</h1>    
        <p>Сөздерді енгізе бастаңыз, олардың аудармасын көріп, дағдыларыңызды жақсартыңыз!</p>
      </div>
    </section>

    <section id="demo">
      <div class="demo-container">
        <div class="word-container" id="word-container"></div>
        <div class="input-container">
          <input
            type="text"
            id="user-input"
            placeholder="Осы жерден жаза бастаңыз..."
          />
          <div id="feedback"></div>
        </div>
      </div>
    </section>

    <section id="pool-selection">
      <div class="pool-container">
        <h3>Сөздер жинағын таңдаңыз:</h3>
        <div class="pool-buttons">
          <button class="pool-btn active" data-pool="all">Барлық сөздер</button>
          <button class="pool-btn" data-pool="animals">Жануарлар</button>
          <button class="pool-btn" data-pool="nature">Табиғат</button>
          <button class="pool-btn" data-pool="objects">Заттар</button>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
